<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
<header>
    <h1>My To-Do List 💜</h1>
    <p>Keep track of your tasks and stay organized!</p>
</header>
<main>

<!-- Adding a Task Section, where you can add priority to the tasks -->
    <section class="add-task">
        <h2>Add a New Task!</h2>
        <input type="text" id="new-task" placeholder="Add a new task...">
        <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
        <button id="add-task">Add</button>      
    </section>

    <!-- Here is going to be the task summary section -->
    <section class="task-summary">
        <h2>Task Summary</h2>
        <p>To Do Tasks: <span id="task-count">0</span></p>
        <p>Doing Tasks: <span id="task-doing-count">0</span></p>
        <p>Completed Tasks: <span id="task-completed-count">0</span></p>
    </section> 
    <!-- Filter Tasks -->
     <h2>Filter by Priority</h2>
    <section class="filter-tasks">
    <button type="button" data-filter="all">All</button>
    <button type="button" data-filter="low">Low</button>
    <button type="button" data-filter="medium">Medium</button>
    <button type="button" data-filter="high">High</button>
    </section>

    <!-- Task Board--> 
     <section class="task-board">
    <div class="task-column">
        <h2>To Do 📝</h2>
        <div id="todo-list"></div>
    </div>

    <div class="task-column">
        <h2>Doing ⏳</h2>
        <div id="doing-list"></div>

        <div class="focus-timer">
            <h3>Focus Timer ⏱️</h3>
            <p id="timer-display">30:00</p>

            <button id="start-timer">Start</button>
            <button id="pause-timer">Pause</button>
            <button id="reset-timer">Reset</button>
        </div>
    </div>

    <div class="task-column">
        <h2>Completed ✅</h2>
        <div id="completed-list"></div>
    </div>
</section>

</main>
</body>
</html>
