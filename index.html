<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
<header>
    <h1>My To-Do List 💜</h1>
    <p>Keep track of your tasks and stay organized!</p>
</header>
<main>

<!-- Adding a Task Section, where you can add priority to the tasks -->
    <section class="add-task">
        <h2>Add a New Task!</h2>
        <input type="text" id="new-task" placeholder="Add a new task...">
        <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
        <button id="add-task">Add</button>      
    </section>

    <!-- Here is going to be the task summary section -->
    <section class="task-summary">
        <h2>Task Summary</h2>
        <div class="summary-container">
        <div class="summary-card">
           <h3>To Do 📝</h3>
           <p id="todo-count">0</p>
           <p>Tasks</p>
        </div>
        <div class="summary-card">
           <h3>Doing ⏳</h3>
           <p id="doing-count">0</p>
           <p>Tasks</p>
        </div>
        <div class="summary-card">
           <h3>Completed ✅</h3>
           <p id="completed-count">0</p>
           <p>Tasks</p>
        </div>
        </div>
    </section> 

    <!-- Filter Tasks -->
    <section class="filter-tasks">
        <h2>Filter by Priority</h2>
    <button type="button" data-filter="all">All</button>
    <button type="button" data-filter="low">Low</button>
    <button type="button" data-filter="medium">Medium</button>
    <button type="button" data-filter="high">High</button>
    </section>
  
<!-- Task Board -->
<section class="task-board">

    <div class="task-column">
        <h2>To Do 📝</h2>
        <div id="todo-list"></div>
    </div>

    <div class="task-column">
        <h2>Doing ⏳</h2>
        <div id="doing-list"></div>
    </div>

    <div class="task-column">
        <h2>Completed ✅</h2>
        <div id="completed-list"></div>
    </div>

</section>

<!-- Focus Timer -->
<section class="focus-timer">
    <h3>Focus Timer ⏱️</h3>
    <p id="timer-display">30:00</p>

    <button type="button" id="start-timer">Start</button>
    <button type="button" id="pause-timer">Pause</button>
    <button type="button" id="reset-timer">Reset</button>
</section>
</main>
</body>
</html>
